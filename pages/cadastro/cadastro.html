<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choki | Cadastro</title>

    <link rel="stylesheet" href="../../css/cadastro.css">

    <script type="text/javascript" src="../../js/cadastro.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
</head>

<body>
    <main>
        <section class="section-form">
            <form autocomplete="off">
                <div class="form-header">
                    <h1>Cadastre-se</h1>
                    <h2>Seja bem-vindo</h2>
                </div>

                <h3>Nome de usuário</h3>
                <div class="input-container">
                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="8" r="4" />
                        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
                    </svg>
                    <input type="text" id="input-username" placeholder="Insira seu nome" />
                </div>
                <h3>Email</h3>
                <div class="input-container">
                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="20" height="16" rx="2" />
                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
                    </svg>
                    <input type="text" id="input-email" placeholder="Insira seu email" />
                </div>
                <h3>Senha</h3>
                <div class="input-container">
                    <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                    <input type="password" id="input-password" placeholder="Insira sua senha" />
                    <svg class="toggle-password" onclick="setPasswordVisibility(this)"
                        xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </div>
                <button type="button" onclick="cadastro(this)">Cadastrar</button>
                <p>Já possui conta? <a href="../login/login.html">Realizar login</a></p>
                <div class="form-status">
                    <p class="alert-field"></p>
                </div>
            </form>
        </section>
        <section class="section-info">
            <div class="logo-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" />
                </svg>
            </div>
            <h1>Acenda só <b>o necessário</b>.</h1>
            <p>Acompanhe o consumo de cada dispositivo e cômodo da sua casa em tempo real com a Choki.</p>
        </section>
    </main>
</body>

</html>
